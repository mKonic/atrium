# atrium-login's settings: copy to /etc/atrium/login.conf to change them.
# Enable it in place of another display manager:
#   systemctl disable sddm.service (or greetd, gdm...)
#   systemctl enable atrium-login.service

[login]
# The VT the login screen and sessions run on.
vt = 1
# The login screen and the user it runs as (made by sysusers.d).
greeter = atrium --greeter
greeter_user = atrium-greeter
# Read /etc/profile and ~/.profile before a session starts.
source_profile = true

[autologin]
# Log this user in at boot, without the login screen (once a boot).
user =
session = atrium

[preferred]
# atrium's own backend (atrium-portal) for everything it serves: screenshots,
# settings, opening and saving files, Open With, printing, notifications,
# shortcuts, the wallpaper, inhibiting, apps' keys in the keyring
# (atrium-keyring), and its "allow this?" dialog.
default=atrium
# Sharing the screen goes through wlroots' screen capture; atrium's chooser
# picks what to share (etc/xdg/xdg-desktop-portal-wlr).
org.freedesktop.impl.portal.ScreenCast=wlr

[preferred]
# GTK's backend for most things: file chooser, settings (colour scheme and
# title-bar button layout, which atrium sets), app chooser, print.
default=gtk
# Sharing the screen and screenshots go through wlroots' screen capture.
org.freedesktop.impl.portal.ScreenCast=hyprland;wlr
org.freedesktop.impl.portal.Screenshot=hyprland;wlr

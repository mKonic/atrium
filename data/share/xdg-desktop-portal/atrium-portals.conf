[preferred]
# GTK's backend for most things: file chooser, settings (colour scheme and
# title-bar button layout, which atrium sets), app chooser, print.
default=gtk
# Sharing the screen: atrium's own streams, picked with its chooser.
org.freedesktop.impl.portal.ScreenCast=atrium
# Screenshots and picking a colour: atrium's screenshot tool.
org.freedesktop.impl.portal.Screenshot=atrium
# Dark or light, the accent and contrast: atrium's own, then GTK's for the rest
# (fonts and the like, from GSettings).
org.freedesktop.impl.portal.Settings=atrium;gtk
# Shortcuts apps register (push-to-talk and the like): atrium's own.
org.freedesktop.impl.portal.GlobalShortcuts=atrium
# An app setting the wallpaper, or keeping the computer awake: atrium's own.
org.freedesktop.impl.portal.Wallpaper=atrium
org.freedesktop.impl.portal.Inhibit=atrium
# Asking whether to allow something (the wallpaper, running in the
# background): atrium's own dialog.
org.freedesktop.impl.portal.Access=atrium
# Passwords apps keep (browsers, mail): KWallet, which KDE apps use already.
org.freedesktop.impl.portal.Secret=kwallet

[preferred]
# GTK's backend for what atrium doesn't do yet: the app chooser, printing.
default=gtk
# Opening and saving files: atrium's own chooser.
org.freedesktop.impl.portal.FileChooser=atrium
# Sharing the screen goes through wlroots' screen capture; atrium's chooser
# picks what to share (etc/xdg/xdg-desktop-portal-wlr).
org.freedesktop.impl.portal.ScreenCast=wlr
# Screenshots and picking a colour: atrium's screenshot tool.
org.freedesktop.impl.portal.Screenshot=atrium
# Dark or light, the accent and contrast, and GNOME's settings for GTK apps
# (fonts, the cursor, title-bar buttons), from GSettings: atrium's own.
org.freedesktop.impl.portal.Settings=atrium
# A sandboxed app's notifications (atrium's notification server), asking
# for the user's name and picture, writing an email, adding a launcher.
org.freedesktop.impl.portal.Notification=atrium
org.freedesktop.impl.portal.Account=atrium
org.freedesktop.impl.portal.Email=atrium
org.freedesktop.impl.portal.DynamicLauncher=atrium
# Shortcuts apps register (push-to-talk and the like): atrium's own.
org.freedesktop.impl.portal.GlobalShortcuts=atrium
# An app setting the wallpaper, or keeping the computer awake: atrium's own.
org.freedesktop.impl.portal.Wallpaper=atrium
org.freedesktop.impl.portal.Inhibit=atrium
# Asking whether to allow something (the wallpaper, running in the
# background): atrium's own dialog.
org.freedesktop.impl.portal.Access=atrium
# Apps' keys in the keyring (sandboxed apps' saved passwords): atrium-keyring.
org.freedesktop.impl.portal.Secret=atrium
